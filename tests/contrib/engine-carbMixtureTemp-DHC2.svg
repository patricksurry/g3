<svg width="216" height="216" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 216">
<defs>
<style>.will-change-transform { will-change: transform; }
.g3-panel { background-color: black; display: block; margin: 0px auto; stroke: none; fill: none; }
.g3-panel * { vector-effect: non-scaling-stroke; }
.g3-panel text { text-anchor: middle; dominant-baseline: central; font-stretch: condensed; fill: rgb(170, 170, 170); }
.g3-axis-ticks-dot,.g3-axis-ticks-wedge,.g3-axis-sector,.g3-fg-fill { fill: rgb(221, 221, 221); }
.g3-axis-line,.g3-axis-ticks,.g3-fg-stroke { stroke: rgb(221, 221, 221); }
.g3-axis-ticks .g3-axis-ticks-dot,.g3-axis-ticks .g3-axis-ticks-wedge { stroke: none; }
.g3-grid-line line { stroke: rgb(102, 102, 102); }
.g3-grid-hairline { stroke: rgb(51, 51, 51); }
.g3-grid-label text { font-size: 8px; text-anchor: middle; dominant-baseline: central; fill: rgb(153, 153, 153); }
.g3-grid-label rect { stroke: none; fill: black; opacity: 0.5; }
.g3-gauge-face,.g3-bg-fill { fill: rgb(24, 24, 24); }
.g3-bg-stroke { stroke: rgb(24, 24, 24); }
.g3-no-fill { fill: none; }
.g3-no-stroke { stroke: none; }
.g3-highlight-fill { fill: orange; }
.g3-highlight-stroke { stroke: orange; stroke-width: 2; }
.g3-danger-stroke { stroke: red; stroke-width: 2; }
.g3-danger-fill { fill: red; }
.g3-warning-fill { fill: rgb(152, 120, 8); }
.g3-normal-fill { fill: green; }
.g3-cold-fill,.g3-sky-fill { fill: rgb(5, 128, 186); }
.g3-ground-fill { fill: rgb(107, 86, 52); }
.g3-indicate-pointer { fill: rgb(34, 34, 34); -webkit-filter: url("#dropShadow2"); filter: url("#dropShadow2"); }
.g3-pointer-needle { fill: red; }
.g3-pointer-blade { fill: rgb(232, 232, 232); stroke: rgb(232, 232, 232); }
.g3-pointer-luminous { fill: rgb(224, 232, 208); stroke: rgb(208, 216, 192); }
.g3-indicate-sector { fill: green; stroke: none; }
.g3-indicate-sector.g3-indicate-sector-negative { fill: red; }
.g3-gauge-screw { fill: rgb(51, 51, 51); -webkit-filter: url("#dropShadow2"); filter: url("#dropShadow2"); }
.g3-gauge-screw rect { fill: rgb(34, 34, 34); }
.g3-highlight { fill: url("#highlightGradient"); fill-opacity: 0.25; }
svg { font-family: "Gill Sans", "Gill Sans MT", Calibri, sans-serif; background: none; }
.g3-panel { background-color: transparent; fill: none; }</style>
